name: Release Please & Lockfile Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-lockfile:
    name: Downstream Auto-Sync pnpm-lock.yaml for Release PR
    needs: release-please
    if: ${{ fromJSON(needs.release-please.outputs.prs_created || 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Parse Release PR Head Branch
        id: pr-meta
        run: |
          HEAD_BRANCH=$(echo '${{ needs.release-please.outputs.pr }}' | jq -r '.headBranchName')
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout Release PR Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr-meta.outputs.head_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Sync client pnpm-lock.yaml
        run: |
          cd client
          pnpm install --lockfile-only
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(deps): auto-sync client pnpm-lock.yaml for release version [skip ci]"
            git push origin HEAD:${{ steps.pr-meta.outputs.head_branch }}
          fi
