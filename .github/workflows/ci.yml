name: Client CI/CD & Verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: pnpm test

      - name: Production Build
        run: pnpm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html missing!" && exit 1)
          echo "Client static export successfully verified!"
